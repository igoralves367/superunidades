
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Unidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Heritage Scout — design tokens (Navy + Latão, costura sutil)
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: { 900: '#0A1428', 800: '#0E1B33', 700: '#13233F', 600: '#1B3052' },
              brass: { DEFAULT: '#C8A04B', bright: '#E4C35C', deep: '#9A7635' },
              scout: '#B23A3A',
              parchment: '#F2E9D8',
              slatemut: '#9AA7BE',
              forest: '#5A8F69',
            },
            fontFamily: {
              display: ['Oswald', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }

      /* ── Heritage Scout · utilitários de patch/costura ───────────────── */

      /* Fundo base — navy heritage com brilho de latão no topo */
      .heritage-bg {
        background:
          radial-gradient(circle at 50% -10%, rgba(200, 160, 75, 0.10), transparent 45%),
          linear-gradient(180deg, #0A1428 0%, #0E1B33 100%);
      }

      /* Anel de costura ao redor de um emblema circular (vira "patch") */
      .patch-ring { position: relative; }
      .patch-ring::after {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 9999px;
        border: 2px dashed rgba(200, 160, 75, 0.5);
        pointer-events: none;
      }

      /* Medalhão de latão — usado para pontos/destaques */
      .medallion {
        background: radial-gradient(circle at 35% 30%, #E4C35C, #C8A04B 55%, #9A7635 100%);
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.45), 0 2px 8px rgba(0, 0, 0, 0.4);
        color: #2A1E08;
      }

      /* Cartão costurado — borda tracejada sutil em latão */
      .stitch-card {
        border: 1.5px dashed rgba(200, 160, 75, 0.28);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(10, 20, 40, 0.6));
      }

      /* Fita / estandarte (pontas chanfradas) para topos de seção */
      .ribbon { clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
